    <title>NexusXV | Game Hub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0f;
            color: #fff;
            min-height: 100vh;
        }

        /* Background */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(100, 70, 255, 0.12), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(0, 180, 255, 0.08), transparent 35%);
            pointer-events: none;
            z-index: -1;
        }

        /* Header */
        header {
            height: 72px;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(10, 10, 14, 0.8);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo span {
            color: #7c5cff;
        }

        .search {
            width: 260px;
            padding: 11px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            outline: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .search:focus {
            border-color: #7c5cff;
            background: rgba(255, 255, 255, 0.08);
        }

        .search::placeholder {
            color: #777;
        }

        /* Main */
        main {
            max-width: 1250px;
            margin: auto;
            padding: 55px 30px 80px;
        }

        .hero {
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: clamp(36px, 6vw, 64px);
            line-height: 1;
            letter-spacing: -3px;
            margin-bottom: 14px;
        }

        .hero p {
            color: #888;
            font-size: 17px;
        }

        /* Categories */
        .categories {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .category {
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: #aaa;
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }

        .category:hover,
        .category.active {
            background: #7c5cff;
            color: white;
            border-color: #7c5cff;
        }

        /* Game Grid */
        .games {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        /* Game Card */
        .game-card {
            background: #121218;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: rgba(124, 92, 255, 0.7);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .game-image {
            height: 155px;
            position: relative;
            overflow: hidden;
            background: #1c1c25;
        }

        .game-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .game-card:hover .game-image img {
            transform: scale(1.06);
        }

        .game-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .game-info {
            padding: 18px;
        }

        .game-info h2 {
            font-size: 18px;
            margin-bottom: 7px;
        }

        .game-info p {
            color: #777;
            font-size: 13px;
            line-height: 1.5;
            height: 39px;
        }

        .play-button {
            width: 100%;
            margin-top: 16px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #7c5cff;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .play-button:hover {
            background: #6847ed;
        }

        /* Empty state */
        .empty {
            display: none;
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }

        .empty h2 {
            color: #aaa;
            margin-bottom: 8px;
        }

        /* Footer */
        footer {
            text-align: center;
            color: #555;
            font-size: 13px;
            padding: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* Mobile */
        @media (max-width: 650px) {
            header {
                padding: 0 18px;
            }

            .search {
                width: 150px;
            }

            main {
                padding: 40px 18px 60px;
            }

            .hero h1 {
                letter-spacing: -2px;
            }

            .games {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        Game<span>Hub</span>
    </div>

    <input
        id="search"
        class="search"
        type="text"
        placeholder="Search games..."
    >
</header>

<main>

    <section class="hero">
        <h1>Choose a game.</h1>
        <p>Pick something to play and have fun.</p>
    </section>

    <div class="categories">
        <button class="category active" data-category="all">All</button>
        <button class="category" data-category="port">Web Ports</button>
    </div>

    <section id="games" class="games"></section>

    <section id="empty" class="empty">
        <h2>No games found</h2>
        <p>Try searching for something else.</p>
    </section>

</main>

<footer>

    const gamesContainer = document.getElementById("games");
    const empty = document.getElementById("empty");
    const search = document.getElementById("search");
    const categoryButtons = document.querySelectorAll(".category");

    let selectedCategory = "all";

    function renderGames() {
        const searchText = search.value.toLowerCase().trim();

        const filteredGames = games.filter(game => {
            const matchesCategory =
                selectedCategory === "all" ||
                game.category === selectedCategory;

            const matchesSearch =
                game.name.toLowerCase().includes(searchText) ||
                game.description.toLowerCase().includes(searchText);

            return matchesCategory && matchesSearch;
        });

        gamesContainer.innerHTML = "";

        if (filteredGames.length === 0) {
            empty.style.display = "block";
            return;
        }

        empty.style.display = "none";

        filteredGames.forEach(game => {
            const card = document.createElement("article");

            card.className = "game-card";

            card.innerHTML = `
                <div class="game-image">
                    <img
                        src="${game.image}"
                        alt="${game.name}"
                        loading="lazy"
                    >

                    <div class="game-tag">
                        ${game.category}
                    </div>
                </div>

                <div class="game-info">
                    <h2>${game.name}</h2>

                    <p>
                        ${game.description}
                    </p>

                    <button class="play-button">
                        Play
                    </button>
                </div>
            `;

            card.querySelector(".play-button").addEventListener("click", () => {
                window.location.href = game.url;
            });

            gamesContainer.appendChild(card);
        });
    }

    categoryButtons.forEach(button => {
        button.addEventListener("click", () => {
            categoryButtons.forEach(btn => {
                btn.classList.remove("active");
            });

            button.classList.add("active");

            selectedCategory = button.dataset.category;

            renderGames();
        });
    });

    search.addEventListener("input", renderGames);

    renderGames();
</script>
